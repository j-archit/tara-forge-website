name: taraforge

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-application-service: &application-service
  build:
    context: .
    dockerfile: Dockerfile.backend
  env_file:
    - path: .env
      required: false
  environment:
    DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-taraforge}:${POSTGRES_PASSWORD:-local-dev-only}@database:5432/${POSTGRES_DB:-taraforge}
  volumes:
    - model-vault:/vault
  networks:
    - private
  read_only: true
  tmpfs:
    - /tmp:size=256m,mode=1777
  logging: *default-logging

services:
  database:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-taraforge}
      POSTGRES_USER: ${POSTGRES_USER:-taraforge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-dev-only}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - private
    logging: *default-logging

  gateway:
    image: caddy:2.10-alpine
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-http://localhost}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - public
    logging: *default-logging

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    restart: unless-stopped
    environment:
      BACKEND_URL: http://backend:8000
      NEXT_TELEMETRY_DISABLED: "1"
    depends_on:
      backend:
        condition: service_healthy
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - public
      - private
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    logging: *default-logging

  migrate:
    <<: *application-service
    command: ["sh", "-c", "python -m alembic upgrade head && python -m app.cli seed-defaults"]
    restart: "no"
    depends_on:
      database:
        condition: service_healthy

  backend:
    <<: *application-service
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  worker:
    <<: *application-service
    command: ["python", "-m", "app.worker"]
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully

  backup:
    <<: *application-service
    profiles: ["tools"]
    command: ["python", "-m", "app.backup", "create", "/backups"]
    volumes:
      - model-vault:/vault
      - application-backups:/backups
    depends_on:
      database:
        condition: service_healthy
    restart: "no"

volumes:
  postgres-data:
  model-vault:
  application-backups:
  caddy-data:
  caddy-config:

networks:
  public:
  private:
    internal: true
